<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合カウンター</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background-color: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 650px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        .header h1 {
            margin: 0 0 10px 0;
            font-size: 1.5em;
            color: #555;
        }
        .total-display {
            font-size: 3em;
            font-weight: bold;
            color: #d93025; /* 合計を目立たせる赤色 */
            line-height: 1;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .counter-card {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .item-name {
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #495057;
            min-height: 2.4em;
        }
        .item-count {
            font-size: 2em;
            font-weight: bold;
            color: #0056b3;
            margin-bottom: 15px;
        }
        
        /* ボタンを横並びにするための設定 */
        .button-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        
        button {
            padding: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        button:hover {
            opacity: 0.85;
        }
        
        /* ＋と－のボタンそれぞれの色と幅の設定 */
        .btn-plus {
            background-color: #0d6efd; /* 青色 */
            flex: 1; /* 幅を均等にする */
        }
        .btn-minus {
            background-color: #6c757d; /* 灰色 */
            flex: 1;
        }
        
        /* 赤伝用の特別カラー */
        .btn-plus-red {
            background-color: #dc3545; /* 赤色 */
            flex: 1;
        }

        .btn-reset {
            background-color: #343a40; /* 濃い灰色 */
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>合計数</h1>
        <div class="total-display" id="total-count">0</div>
    </div>

    <div class="grid-container">
        <div class="counter-card">
            <div class="item-name">現金<br>（フリー）</div>
            <div class="item-count" id="count-cashFree">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('cashFree')">－</button>
                <button class="btn-plus" onclick="increment('cashFree')">＋</button>
            </div>
        </div>
        <div class="counter-card">
            <div class="item-name">現金<br>（指名）</div>
            <div class="item-count" id="count-cashNominated">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('cashNominated')">－</button>
                <button class="btn-plus" onclick="increment('cashNominated')">＋</button>
            </div>
        </div>

        <div class="counter-card">
            <div class="item-name">PayPay<br>（フリー）</div>
            <div class="item-count" id="count-paypayFree">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('paypayFree')">－</button>
                <button class="btn-plus" onclick="increment('paypayFree')">＋</button>
            </div>
        </div>
        <div class="counter-card">
            <div class="item-name">PayPay<br>（指名）</div>
            <div class="item-count" id="count-paypayNominated">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('paypayNominated')">－</button>
                <button class="btn-plus" onclick="increment('paypayNominated')">＋</button>
            </div>
        </div>

        <div class="counter-card">
            <div class="item-name">契約店<br>（フリー）</div>
            <div class="item-count" id="count-contractFree">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('contractFree')">－</button>
                <button class="btn-plus" onclick="increment('contractFree')">＋</button>
            </div>
        </div>
        <div class="counter-card">
            <div class="item-name">契約店<br>（指名）</div>
            <div class="item-count" id="count-contractNominated">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('contractNominated')">－</button>
                <button class="btn-plus" onclick="increment('contractNominated')">＋</button>
            </div>
        </div>

        <div class="counter-card">
            <div class="item-name">チケット<br>（フリー）</div>
            <div class="item-count" id="count-ticketFree">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('ticketFree')">－</button>
                <button class="btn-plus" onclick="increment('ticketFree')">＋</button>
            </div>
        </div>
        <div class="counter-card">
            <div class="item-name">チケット<br>（指名）</div>
            <div class="item-count" id="count-ticketNominated">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('ticketNominated')">－</button>
                <button class="btn-plus" onclick="increment('ticketNominated')">＋</button>
            </div>
        </div>

        <div class="counter-card">
            <div class="item-name">PC<br>（フリー）</div>
            <div class="item-count" id="count-pcFree">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('pcFree')">－</button>
                <button class="btn-plus" onclick="increment('pcFree')">＋</button>
            </div>
        </div>
        <div class="counter-card">
            <div class="item-name">PC<br>（指名）</div>
            <div class="item-count" id="count-pcNominated">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('pcNominated')">－</button>
                <button class="btn-plus" onclick="increment('pcNominated')">＋</button>
            </div>
        </div>

        <div class="counter-card">
            <div class="item-name">カット<br>（フリー）</div>
            <div class="item-count" id="count-cutFree">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('cutFree')">－</button>
                <button class="btn-plus" onclick="increment('cutFree')">＋</button>
            </div>
        </div>
        <div class="counter-card">
            <div class="item-name">カット<br>（指名）</div>
            <div class="item-count" id="count-cutNominated">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('cutNominated')">－</button>
                <button class="btn-plus" onclick="increment('cutNominated')">＋</button>
            </div>
        </div>

        <div class="counter-card">
            <div class="item-name"><br>赤伝</div>
            <div class="item-count" id="count-redSlip">0</div>
            <div class="button-group">
                <button class="btn-minus" onclick="decrement('redSlip')">－</button>
                <button class="btn-plus-red" onclick="increment('redSlip')">＋</button>
            </div>
        </div>
    </div>

    <button class="btn-reset" onclick="resetAll()">すべてリセット</button>
</div>

<script>
    // PayPayを含めた全13項目のデータを初期化
    let counts = {
        cashFree: 0,
        cashNominated: 0,
        paypayFree: 0,
        paypayNominated: 0,
        contractFree: 0,
        contractNominated: 0,
        ticketFree: 0,
        ticketNominated: 0,
        pcFree: 0,
        pcNominated: 0,
        cutFree: 0,
        cutNominated: 0,
        redSlip: 0
    };

    // ＋ボタン：数字を増やす
    function increment(key) {
        counts[key]++;
        document.getElementById('count-' + key).innerText = counts[key];
        updateTotal();
    }

    // －ボタン：数字を減らす（0より小さくならないようにする）
    function decrement(key) {
        if (counts[key] > 0) {
            counts[key]--;
            document.getElementById('count-' + key).innerText = counts[key];
            updateTotal();
        }
    }

    // 合計数を計算して表示
    function updateTotal() {
        let total = 0;
        for (let key in counts) {
            total += counts[key];
        }
        document.getElementById('total-count').innerText = total;
    }

    // すべてのカウントを0に戻す
    function resetAll() {
        if(!confirm("すべてのカウントをリセットしますか？")) return; // 誤タップ防止で確認メッセージを出します

        for (let key in counts) {
            counts[key] = 0;
            document.getElementById('count-' + key).innerText = 0;
        }
        updateTotal();
    }
</script>

</body>
</html>
