<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合カウンター</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background-color: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        .header h1 {
            margin: 0 0 10px 0;
            font-size: 1.5em;
            color: #555;
        }
        .total-display {
            font-size: 3em;
            font-weight: bold;
            color: #d93025; /* 合計を目立たせる赤色 */
            line-height: 1;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .counter-card {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .item-name {
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #495057;
            min-height: 2.4em; /* 2行になっても高さを揃える */
        }
        .item-count {
            font-size: 2em;
            font-weight: bold;
            color: #0056b3;
            margin-bottom: 15px;
        }
        button {
            padding: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.95); /* クリック時に少しへこむアニメーション */
        }
        button:hover {
            opacity: 0.85;
        }
        .btn-add {
            background-color: #0d6efd; /* 青色 */
            width: 100%;
        }
        .btn-add-red {
            background-color: #dc3545; /* 赤伝用 */
            width: 100%;
        }
        .btn-reset {
            background-color: #6c757d;
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>合計数</h1>
        <div class="total-display" id="total-count">0</div>
    </div>

    <div class="grid-container">
        <div class="counter-card">
            <div class="item-name">現金<br>（フリー）</div>
            <div class="item-count" id="count-cashFree">0</div>
            <button class="btn-add" onclick="increment('cashFree')">追加</button>
        </div>
        <div class="counter-card">
            <div class="item-name">現金<br>（指名）</div>
            <div class="item-count" id="count-cashNominated">0</div>
            <button class="btn-add" onclick="increment('cashNominated')">追加</button>
        </div>

        <div class="counter-card">
            <div class="item-name">契約店<br>（フリー）</div>
            <div class="item-count" id="count-contractFree">0</div>
            <button class="btn-add" onclick="increment('contractFree')">追加</button>
        </div>
        <div class="counter-card">
            <div class="item-name">契約店<br>（指名）</div>
            <div class="item-count" id="count-contractNominated">0</div>
            <button class="btn-add" onclick="increment('contractNominated')">追加</button>
        </div>

        <div class="counter-card">
            <div class="item-name">チケット<br>（フリー）</div>
            <div class="item-count" id="count-ticketFree">0</div>
            <button class="btn-add" onclick="increment('ticketFree')">追加</button>
        </div>
        <div class="counter-card">
            <div class="item-name">チケット<br>（指名）</div>
            <div class="item-count" id="count-ticketNominated">0</div>
            <button class="btn-add" onclick="increment('ticketNominated')">追加</button>
        </div>

        <div class="counter-card">
            <div class="item-name">PC<br>（フリー）</div>
            <div class="item-count" id="count-pcFree">0</div>
            <button class="btn-add" onclick="increment('pcFree')">追加</button>
        </div>
        <div class="counter-card">
            <div class="item-name">PC<br>（指名）</div>
            <div class="item-count" id="count-pcNominated">0</div>
            <button class="btn-add" onclick="increment('pcNominated')">追加</button>
        </div>

        <div class="counter-card">
            <div class="item-name">カット<br>（フリー）</div>
            <div class="item-count" id="count-cutFree">0</div>
            <button class="btn-add" onclick="increment('cutFree')">追加</button>
        </div>
        <div class="counter-card">
            <div class="item-name">カット<br>（指名）</div>
            <div class="item-count" id="count-cutNominated">0</div>
            <button class="btn-add" onclick="increment('cutNominated')">追加</button>
        </div>

        <div class="counter-card">
            <div class="item-name"><br>赤伝</div>
            <div class="item-count" id="count-redSlip">0</div>
            <button class="btn-add-red" onclick="increment('redSlip')">追加</button>
        </div>
    </div>

    <button class="btn-reset" onclick="resetAll()">すべてリセット</button>
</div>

<script>
    // 各項目のカウントを管理するオブジェクト
    let counts = {
        cashFree: 0,
        cashNominated: 0,
        contractFree: 0,
        contractNominated: 0,
        ticketFree: 0,
        ticketNominated: 0,
        pcFree: 0,
        pcNominated: 0,
        cutFree: 0,
        cutNominated: 0,
        redSlip: 0
    };

    // 特定の項目をカウントアップする関数
    function increment(key) {
        counts[key]++; // 指定された項目の数字を1増やす
        document.getElementById('count-' + key).innerText = counts[key]; // 画面の数字を更新
        updateTotal(); // 合計を再計算
    }

    // 合計数を計算して表示する関数
    function updateTotal() {
        let total = 0;
        // すべての項目の数値を足し合わせる
        for (let key in counts) {
            total += counts[key];
        }
        document.getElementById('total-count').innerText = total; // 合計の表示を更新
    }

    // すべてのカウントを0に戻す関数
    function resetAll() {
        // 確認メッセージを出したい場合は以下のコメント(//)を外してください
        // if(!confirm("すべてのカウントをリセットしますか？")) return;

        for (let key in counts) {
            counts[key] = 0; // データを0にする
            document.getElementById('count-' + key).innerText = 0; // 画面の表示を0にする
        }
        updateTotal(); // 合計も0に更新する
    }
</script>

</body>
</html>
